[workspace]
members = [
    "crates/tond-server",
    "crates/tond-cli",
    "crates/tond-proxy",
    "crates/tond-common",
    "crates/tond-scanner",
]
resolver = "3"

[profile.release]
strip = "symbols"   # drop debug symbols — biggest size reduction, no runtime cost
lto = true          # whole-program dead-code elimination across crates
codegen-units = 1   # required for effective LTO; slows release compile, not runtime
panic = "abort"     # removes unwinding machinery; fine for daemon/CLI binaries
# opt-level intentionally left at default (3) — server and proxy are I/O-bound but
# CPU hotpaths (argon2, AES-GCM, TLS) benefit from full optimisation, not size-shrinking

# Fast optimised build for dev-server deploys (`just deploy*`). Same opt-level as
# release, but skips LTO and enables incremental + parallel codegen so rebuilds after
# small changes take seconds, not minutes. Binaries are somewhat larger/slower than
# release — use `just profile=release deploy` to test the real release artefacts.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# Hashing and compression run over whole snapshot archives; keep them
# optimised in debug/test builds so streaming tests take seconds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50.0", features = ["full"] }

# Web framework
axum = { version = "0.8.8", features = ["multipart", "ws"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.18.0"
toml = "1.1.6"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
# Same SQLite build sqlx links; used directly only for SQLITE_FCNTL_PERSIST_WAL
libsqlite3-sys = { version = "0.30.1", default-features = false }
# LevelFilter for sqlx's statement logging settings
log = "0.4"

# YAML (compose file validation; already in the tree via pingora)
serde_yaml = "0.9.34"

# Docker
bollard = "0.21.1"

# CLI
clap = { version = "4.6.0", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.13.2", features = ["json", "multipart", "stream", "rustls"], default-features = false }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# UUID
uuid = { version = "1.22.0", features = ["v4", "serde"] }

# Async utils
futures = "0.3.32"
tokio-stream = "0.1.18"
# CancellationToken + TaskTracker (graceful shutdown)
tokio-util = { version = "0.7.19", features = ["rt"] }

# Crypto / auth
sha2 = "0.11.0"
rand = "0.10.3"
hex = "0.4.3"
argon2 = "0.6.0"
hmac = "0.13.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "rand_core"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"

# TLS / ACME
instant-acme = "0.8.5"
# Only used to pick the process-wide crypto provider (see tond_common::install_crypto_provider)
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1.0.9"
# Streaming AES-256-GCM for snapshot archives (already in the tree via rustls)
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
rcgen = "0.14.7"
# Audit shipping to syslog over TLS (RFC 5425); both already in the tree via reqwest
tokio-rustls = { version = "0.26.5", default-features = false, features = ["tls12"] }
rustls-platform-verifier = "0.7.1"
openssl = "0.10.75"

# WebSocket client
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# System info
sysinfo = "0.39.6"
# statvfs for the host disk gauge (already in the tree via tempfile)
rustix = { version = "1.1.5", features = ["fs"] }

# Cron expression parsing + next-run computation
cron = "0.17.0"

# Timezone-aware cron scheduling
chrono-tz = "0.10.4"

# JWT generation (GitHub App RS256 tokens)
# rust_crypto = pure-Rust RustCrypto provider; use_pem = PEM key parsing support
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto", "use_pem"] }

# Public Suffix List (registrable-domain checks for the preview domain)
psl = "2.1.238"

# URL percent-encoding helper
urlencoding = "2.1.3"

# 2FA
totp-rs = { version = "6.0.0", features = ["qr"] }

# Email (SMTP) for notification integrations
lettre = { version = "0.11.20", features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }

# Compression + archiving
flate2 = "1.1.9"
tar = "0.4.45"

# Directory traversal (backup engine hard-link deduplication)
walkdir = "2.5.0"

# Terminal / proxy internals
portable-pty = "0.9.0"
bytes = "1.11.1"
pingora = { version = "0.9.0", features = ["lb", "openssl"] }
async-trait = "0.1.89"

# Release signature verification (`tond update`); `minisign` signs in tests only
minisign-verify = "0.3.0"
minisign = "0.10.0"

# Test helpers
filetime = "0.2.27"
tempfile = "3.27.0"
