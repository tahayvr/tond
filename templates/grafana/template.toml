id = "grafana"
name = "Grafana"
description = "Dashboards and alerting for metrics, logs and traces from any data source."
about = "Grafana visualises data from Prometheus, Loki, PostgreSQL, MySQL, InfluxDB and dozens of other sources in shareable dashboards with alerting. Pick 'Grafana + Prometheus' instead if you also want a metrics database."
category = "monitoring"
tags = ["dashboards", "metrics", "observability", "alerting", "charts"]
logo = "grafana"
version = "12.4"
website = "https://grafana.com/oss/grafana/"
docs = "https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/"
repository = "https://github.com/grafana/grafana"
ram_mb = 150
setup_notes = "Sign in as admin with the password shown below, then add a data source under Connections."
upgrade_notes = "Change the image to a newer tag and redeploy; the SQLite database is migrated on start. Snapshot first before a major version."
post_deploy_checks = ["Sign in as admin", "Add a data source"]

[public]
service = "grafana"
port = 3000
health_path = "/api/health"

[[inputs]]
key = "GF_SERVER_ROOT_URL"
label = "Root URL"
value = "{app_url}"

[[inputs]]
key = "ADMIN_PASSWORD"
label = "Admin password"
kind = "password"
generate = "password"
credential = true

[[volumes]]
service = "grafana"
path = "./data"
description = "Dashboards, users, plugins and settings (SQLite)"
owner = "472:0"
