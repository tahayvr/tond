id = "n8n"
name = "n8n"
description = "Workflow automation with 400+ integrations, code steps and AI nodes."
about = "n8n connects APIs, databases and services with visual workflows, triggered by webhooks, schedules or events. Mix drag-and-drop nodes with JavaScript or Python where you need them. This template uses SQLite, which is plenty for personal and small-team use."
category = "automation"
tags = ["automation", "workflows", "zapier alternative", "webhooks", "ai"]
logo = "n8n"
version = "2.41"
website = "https://n8n.io"
docs = "https://docs.n8n.io/hosting/"
repository = "https://github.com/n8n-io/n8n"
ram_mb = 350
setup_notes = "Open the app right away and create the owner account. Webhook URLs use this app's address, so set the domain before building workflows."
upgrade_notes = "Change the image to a newer 2.x tag and redeploy. Keep the encryption key: without it saved credentials can't be decrypted. Read the breaking-changes page before a major version."
post_deploy_checks = ["Create the owner account", "Build a test workflow with a webhook trigger"]

[public]
service = "n8n"
port = 5678
health_path = "/healthz"

[[inputs]]
key = "N8N_HOST"
label = "Host"
value = "{app_host}"

[[inputs]]
key = "WEBHOOK_URL"
label = "Webhook URL"
value = "{app_url}/"

[[inputs]]
key = "N8N_ENCRYPTION_KEY"
label = "Encryption key"
description = "Encrypts saved credentials. Keep it if you move the data."
generate = "hex"

[[inputs]]
key = "GENERIC_TIMEZONE"
label = "Time zone"
description = "Used by schedule triggers, e.g. Europe/Berlin."
default = "UTC"

[[volumes]]
service = "n8n"
path = "./data"
description = "Workflows, credentials and execution history (SQLite)"
owner = "1000:1000"
