id = "nextcloud"
name = "Nextcloud"
description = "Files, calendars, contacts and office apps in your own cloud."
about = "Nextcloud syncs files across your devices and adds calendars, contacts, notes and hundreds of apps. This lite setup runs Nextcloud with PostgreSQL and no extra cache server, which suits a handful of users on a small VPS."
category = "storage"
tags = ["files", "sync", "dropbox alternative", "calendar", "contacts", "cloud"]
logo = "nextcloud"
version = "34"
website = "https://nextcloud.com"
docs = "https://github.com/nextcloud/docker"
repository = "https://github.com/nextcloud/server"
ram_mb = 600
setup_notes = "The first start installs Nextcloud and takes a minute or two. Then sign in as admin with the password shown below. Install the desktop and mobile clients and point them at this address."
upgrade_notes = "Nextcloud only upgrades one major version at a time (34 → 35, never 34 → 36). Snapshot the app, change the image tag to the next major and redeploy; the upgrade runs on start."
post_deploy_checks = ["Sign in as admin", "Check Administration → Overview for warnings"]

[public]
service = "nextcloud"
port = 80
health_path = "/status.php"

[[inputs]]
key = "NEXTCLOUD_TRUSTED_DOMAINS"
label = "Trusted domain"
value = "{app_host}"

[[inputs]]
key = "OVERWRITE_CLI_URL"
label = "Public URL"
value = "{app_url}"

[[inputs]]
key = "ADMIN_PASSWORD"
label = "Admin password"
kind = "password"
generate = "password"
credential = true

[[inputs]]
key = "DB_PASSWORD"
label = "Database password"
generate = "password"

[[volumes]]
service = "nextcloud"
path = "./html"
description = "Nextcloud's code, config, apps and every user's files"

[[volumes]]
service = "db"
path = "./postgres"
description = "PostgreSQL data: users, shares, calendars and file metadata"
