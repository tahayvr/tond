id = "mattermost"
name = "Mattermost"
description = "Team chat with channels, threads, calls and integrations, a Slack alternative."
about = "Mattermost Team Edition is an open-source messaging platform with channels, threads, file sharing, search, playbooks and a large integration ecosystem, with desktop and mobile apps. Its configuration is stored in the database, so settings you change in the System Console survive redeploys. The Team Edition image is published for x86_64 only."
category = "communication"
tags = ["chat", "slack alternative", "team", "messaging"]
logo = "mattermost"
version = "11.11"
website = "https://mattermost.com"
docs = "https://docs.mattermost.com/deployment-guide/server/deploy-containers.html"
repository = "https://github.com/mattermost/mattermost"
architectures = ["amd64"]
ram_mb = 800
setup_notes = "Sign in as the system admin with the password shown after deploy (also kept as ADMIN_PASSWORD on the Environment tab), create a team and invite people: sign-up needs an invitation."
upgrade_notes = "Change the image to a newer tag and redeploy; the database is migrated on start. Stay on Extended Support Releases for fewer upgrades, and snapshot first."
post_deploy_checks = ["Sign in as the system admin", "Configure SMTP in the System Console for invites and notifications"]

[public]
service = "mattermost"
port = 8065
health_path = "/api/v4/system/ping"

[[inputs]]
key = "MM_SERVICESETTINGS_SITEURL"
label = "Site URL"
value = "{app_url}"

[[inputs]]
key = "DB_PASSWORD"
label = "Database password"
generate = "password"

[[inputs]]
key = "ADMIN_USERNAME"
label = "System admin username"
default = "sysadmin"

[[inputs]]
key = "ADMIN_EMAIL"
label = "System admin email"
kind = "email"

[[inputs]]
key = "ADMIN_PASSWORD"
label = "System admin password"
kind = "password"
generate = "password"
credential = true

[[volumes]]
service = "mattermost"
path = "./data"
description = "Uploaded files and images"
owner = "2000:2000"

[[volumes]]
service = "mattermost"
path = "./plugins"
description = "Server plugins"
owner = "2000:2000"

[[volumes]]
service = "mattermost"
path = "./client-plugins"
description = "Web app plugins"
owner = "2000:2000"

[[volumes]]
service = "db"
path = "./postgres"
description = "PostgreSQL data: messages, users, channels and settings"

# Mattermost makes the first account a system admin. Its image has no shell, and
# mmctl takes the password only as an argument (visible in the host's process
# list), so the account is created through the REST API from the db container
# (busybox sh and wget) before the app is routed. The JSON goes in on stdin,
# built by the shell's printf: no value lands on a command line. A retried step
# whose account exists already passes on its login and changes nothing.
[[post_deploy]]
service = "db"
description = "Create the system admin account"
env = ["ADMIN_USERNAME", "ADMIN_EMAIL", "ADMIN_PASSWORD"]
command = ["sh", "-c", '''
set -e
esc() { printf '%s' "$1" | sed 's/[\\"]/\\&/g'; }
u=$(esc "$ADMIN_USERNAME"); e=$(esc "$ADMIN_EMAIL"); p=$(esc "$ADMIN_PASSWORD")
post() { wget -q -O /dev/null -T 30 --header 'Content-Type: application/json' --post-file /dev/stdin "http://mattermost:8065/api/v4/$1"; }
if printf '{"login_id":"%s","password":"%s"}' "$u" "$p" | post users/login 2>/dev/null; then exit 0; fi
printf '{"username":"%s","email":"%s","password":"%s"}' "$u" "$e" "$p" | post users
''']
timeout_secs = 180
