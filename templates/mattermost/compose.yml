services:
  mattermost:
    image: mattermost/mattermost-team-edition:11.11
    restart: unless-stopped
    mem_limit: 1g
    ports: ["8065"]
    environment:
      TZ: UTC
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${DB_PASSWORD}@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_CONFIG: postgres://mattermost:${DB_PASSWORD}@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL}
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/data/bleve-indexes
    volumes:
      - ./data:/mattermost/data
      - ./plugins:/mattermost/plugins
      - ./client-plugins:/mattermost/client/plugins
    depends_on:
      db:
        condition: service_healthy
    # Timings only: the image's own HEALTHCHECK test is kept, but its 30s interval
    # would keep the deploy waiting.
    healthcheck:
      interval: 10s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  db:
    image: postgres:17-alpine
    labels:
      tond.backup.dump: pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" --clean --if-exists
      tond.backup.restore: psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q -v ON_ERROR_STOP=1
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mattermost -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 10
