services:
  metabase:
    image: metabase/metabase:v0.58.34
    restart: unless-stopped
    mem_limit: 1280m
    ports: ["3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${DB_PASSWORD}
      MB_SITE_URL: ${MB_SITE_URL}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_OPTS: -Xmx768m -XX:+UseSerialGC
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    labels:
      tond.backup.dump: pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" --clean --if-exists
      tond.backup.restore: psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q -v ON_ERROR_STOP=1
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
