id = "forgejo"
name = "Forgejo"
description = "Community-run Git forge: repositories, issues, pull requests and CI."
about = "Forgejo is a lightweight, community-governed Git forge (a Gitea fork) with repositories, code review, issues, wikis, packages and Actions CI. This template uses SQLite and HTTPS clone URLs; SSH is off because Tond only routes HTTP."
category = "developer"
tags = ["git", "forge", "code review", "github alternative", "ci"]
logo = "forgejo"
version = "15"
website = "https://forgejo.org"
docs = "https://forgejo.org/docs/latest/admin/installation-docker/"
repository = "https://codeberg.org/forgejo/forgejo"
ram_mb = 250
setup_notes = "Sign in with the administrator name and the password shown after deploy (also kept as ADMIN_PASSWORD on the Environment tab). There is no install page and public sign-up is off: add users under Site Administration."
upgrade_notes = "The image follows Forgejo 15.x. For a new major, change the tag, snapshot the app first and read the release notes; the database is migrated on start."
post_deploy_checks = ["Sign in as the administrator", "Push a test repository over HTTPS"]

[public]
service = "forgejo"
port = 3000
health_path = "/api/healthz"

[[inputs]]
key = "ROOT_URL"
label = "Root URL"
value = "{app_url}/"

[[inputs]]
key = "DOMAIN"
label = "Domain"
value = "{app_host}"

[[inputs]]
key = "ADMIN_USERNAME"
label = "Administrator name"
description = "Forgejo reserves some names, such as admin."
default = "forgeadmin"

[[inputs]]
key = "ADMIN_EMAIL"
label = "Administrator email"
kind = "email"

[[inputs]]
key = "ADMIN_PASSWORD"
label = "Administrator password"
kind = "password"
generate = "password"
credential = true

[[inputs]]
key = "SECRET_KEY"
label = "Secret key"
description = "Encrypts secrets in the database. Keep it if you move the data."
generate = "hex"

[[volumes]]
service = "forgejo"
path = "./data"
description = "Repositories, attachments, packages and the SQLite database"

# The install page is locked (INSTALL_LOCK), so nobody can claim the server;
# the administrator is created with Forgejo's CLI (/usr/local/bin/forgejo in
# the codeberg.org/forgejo/forgejo image, run as its git user) before the app
# is routed.
[[post_deploy]]
service = "forgejo"
user = "git"
description = "Create the administrator account"
env = ["ADMIN_USERNAME", "ADMIN_EMAIL", "ADMIN_PASSWORD"]
command = ["sh", "-c", "forgejo admin user list --admin | awk 'NR > 1 { print $2 }' | grep -qx \"$ADMIN_USERNAME\" || forgejo admin user create --admin --username \"$ADMIN_USERNAME\" --email \"$ADMIN_EMAIL\" --password \"$ADMIN_PASSWORD\" --must-change-password=false"]
