services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    mem_limit: 512m
    ports: ["3000"]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: ${ROOT_URL}
      FORGEJO__server__DOMAIN: ${DOMAIN}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # No install page: Tond creates the administrator before the app is
      # reachable (post_deploy in template.toml).
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./data:/data
