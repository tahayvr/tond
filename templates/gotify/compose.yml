services:
  gotify:
    image: gotify/server:2.9.1
    restart: unless-stopped
    mem_limit: 128m
    ports: ["80"]
    environment:
      GOTIFY_DEFAULTUSER_NAME: admin
      GOTIFY_DEFAULTUSER_PASS: ${ADMIN_PASSWORD}
      GOTIFY_REGISTRATION: "false"
      TZ: UTC
    volumes:
      - ./data:/app/data
