services:
  vaultwarden:
    image: vaultwarden/server:1.37.3-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports: ["80"]
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./data:/data
    # Timings only: the image's own HEALTHCHECK test is kept, but its 60s interval
    # would keep the deploy waiting.
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
