id = "excalidraw"
name = "Excalidraw"
description = "Virtual whiteboard for sketching hand-drawn-style diagrams."
about = "Excalidraw is a collaborative-feeling whiteboard with a hand-drawn look, perfect for diagrams, wireframes and quick sketches. Drawings stay in your browser (or export to files); live collaboration needs a separate room server and is not included. The upstream image is published for x86_64 only."
category = "productivity"
tags = ["whiteboard", "diagrams", "drawing", "sketch"]
logo = "excalidraw"
version = "sha-4bfc5bb"
website = "https://excalidraw.com"
docs = "https://github.com/excalidraw/excalidraw#self-hosting"
repository = "https://github.com/excalidraw/excalidraw"
ram_mb = 20
setup_notes = "Open the app and start drawing. Drawings are saved in your browser; export them to keep copies."
upgrade_notes = "Excalidraw publishes images per commit. Replace the sha-… tag with a newer one from Docker Hub and redeploy."
post_deploy_checks = ["Open the app and draw something"]

[public]
service = "excalidraw"
port = 80
health_path = "/"
