services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    mem_limit: 768m
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    ports: ["8000"]
    environment:
      BASE_URL: ${BASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      HTTP_PORT: "8000"
      DATABASE_URL: postgres://plausible:${DB_PASSWORD}@db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://events:8123/plausible_events
      DISABLE_REGISTRATION: invite_only
    volumes:
      - ./plausible:/var/lib/plausible
    depends_on:
      db:
        condition: service_healthy
      events:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: plausible
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U plausible -d plausible"]
      interval: 5s
      timeout: 5s
      retries: 10

  events:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse:/var/lib/clickhouse
    configs:
      - source: clickhouse_logs
        target: /etc/clickhouse-server/config.d/logs.xml
      - source: clickhouse_ipv4
        target: /etc/clickhouse-server/config.d/ipv4-only.xml
      - source: clickhouse_low_resources
        target: /etc/clickhouse-server/users.d/low-resources.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

configs:
  clickhouse_logs:
    content: |
      <clickhouse>
        <logger><level>warning</level><console>true</console></logger>
        <query_log replace="1"><database>system</database><table>query_log</table><flush_interval_milliseconds>7500</flush_interval_milliseconds><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_log>
        <query_thread_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <trace_log remove="remove"/>
        <text_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
      </clickhouse>
  clickhouse_ipv4:
    content: |
      <clickhouse>
        <listen_host>0.0.0.0</listen_host>
      </clickhouse>
  clickhouse_low_resources:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <max_threads>1</max_threads>
            <max_block_size>8192</max_block_size>
            <max_download_threads>1</max_download_threads>
            <input_format_parallel_parsing>0</input_format_parallel_parsing>
            <output_format_parallel_formatting>0</output_format_parallel_formatting>
          </default>
        </profiles>
      </clickhouse>
