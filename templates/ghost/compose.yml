services:
  ghost:
    image: ghost:6-alpine
    restart: unless-stopped
    mem_limit: 512m
    ports: ["2368"]
    environment:
      url: ${GHOST_URL}
      NODE_ENV: production
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${DB_PASSWORD}
      database__connection__database: ghost
    volumes:
      - ./content:/var/lib/ghost/content
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    labels:
      tond.backup.dump: MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqldump -uroot --databases "$$MYSQL_DATABASE" --single-transaction --routines --events
      tond.backup.restore: MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot
    restart: unless-stopped
    mem_limit: 512m
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
      start_interval: 1s
