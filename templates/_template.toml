# Example Tond template manifest.
#
# Copy this file to templates/<your-template>.toml and replace the example values.
# Keep manifests declarative: no shell hooks, no runtime fetching, no hidden logic.

# Stable template identifier used by `tond apps create --template <id>`.
id = "example-app"

# Human-readable display name.
name = "Example App"

# Short summary shown in template listings and future UI surfaces.
description = "Example self-hosted application"

# Broad product grouping such as analytics, cms, docs, database, internal-tools.
category = "productivity"

# Optional search/filter tags.
tags = ["example", "demo"]

# Optional maintainers or owners for this template definition.
maintainers = ["tond"]

# Optional suggested public domains for docs/examples.
recommended_domains = ["app.example.com"]

# Optional setup note shown after creation/deploy.
setup_notes = "Set the required environment variables before the first deploy."

# Optional manual checks to perform after deploy.
post_deploy_checks = [
  "Open /health and verify it returns 200",
  "Log in and finish the product-specific setup flow",
]

[source]
# Required. Supported values today: git, image.
kind = "git"

# Required. Git clone URL or container image reference.
url = "https://github.com/example/app.git"

# Optional. Explicit git ref or image tag/digest.
# Use an immutable commit SHA when reproducibility matters most.
ref = "refs/tags/v1.0.0"

[deploy]
# Required. Supported values today:
# - tbuild     for managed source builds
# - dockerfile for source repos with an explicit Dockerfile flow
# - image      for direct container image deploys
method = "tbuild"

# Required. Container port the app listens on.
default_port = 8080

# Optional. Health endpoint used by Tond health checks.
health_check_path = "/health"

# Optional. Persistent volume hints for the template.
[[deploy.volumes]]
container_path = "/var/lib/example-app"
description = "Persistent application data"

# Optional. Environment variables the operator must provide.
[[required_env]]
key = "APP_URL"
description = "Public base URL for the application"
required = true

[[required_env]]
key = "SECRET_KEY"
description = "Application secret used for sessions and encryption"
required = true

# Optional. Nice-to-have environment variables.
[[optional_env]]
key = "LOG_LEVEL"
description = "Application log level"
required = false

# Optional. Dependencies the template expects.
[[dependencies]]
kind = "database"
engine = "postgres"
required = true
