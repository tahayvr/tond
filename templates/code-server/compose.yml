services:
  code-server:
    image: codercom/code-server:4.139.1
    restart: unless-stopped
    mem_limit: 1g
    ports: ["8080"]
    environment:
      PASSWORD: ${PASSWORD}
    command: ["--bind-addr", "0.0.0.0:8080", "--disable-telemetry", "/home/coder/project"]
    volumes:
      - ./project:/home/coder/project
      - ./config:/home/coder/.config
      - ./local:/home/coder/.local
