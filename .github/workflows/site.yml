name: Site

# Builds tond.io (the landing page, the docs at /docs, /install and /update)
# exactly like `just site-build` and deploys it to GitHub Pages
# (Settings → Pages → Source: GitHub Actions; see docs/SITE.md).
#
# Runs only when something the site is built from changes on main, or by hand.
# Node and pnpm only: the generated docs pages that need Rust
# (content/reference/cli.md, src/data/exit-codes.json, openapi.json) are
# committed and refreshed with `just docs-gen` / `just openapi`.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "release/web/install.sh"
      - "release/web/update.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Actions are pinned by commit SHA (supply-chain hardening); the comment names
# the tag the SHA was taken from.

jobs:
  build:
    name: Build tond.io
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # = `just site-build`: docs (link check), landing page, assembly, site tests.
      - run: pnpm build
      - run: pnpm build:site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
