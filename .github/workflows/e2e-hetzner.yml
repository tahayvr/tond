name: E2E (Hetzner)

# Runs the smoke test on a throwaway Hetzner Cloud server with real public DNS
# (<ip>.sslip.io) and real ACME (Let's Encrypt staging). The server is deleted
# at the end of every run. Requires the HCLOUD_TOKEN repository secret.

on:
  workflow_dispatch:
    inputs:
      acme:
        description: ACME mode
        type: choice
        default: letsencrypt-staging
        options: [letsencrypt-staging, pebble]
      arch:
        description: Server architecture (x86_64 → cx23, aarch64 → cax11)
        type: choice
        default: x86_64
        options: [x86_64, aarch64]

concurrency:
  group: e2e-hetzner
  cancel-in-progress: false

permissions:
  contents: read

# Actions are pinned by commit SHA (supply-chain hardening); the comment names
# the tag or branch the SHA was taken from.

jobs:
  e2e:
    # The bundle is built natively, so the runner matches the server's arch.
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Require HCLOUD_TOKEN
        run: |
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::Set the HCLOUD_TOKEN repository secret (Hetzner Cloud API token, read/write)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: hetznercloud/setup-hcloud@4ff9bbeda4053fb69dd7fa1fcbdfcce7e648bf33 # v1

      - name: Delete stale e2e servers
        run: e2e/hcloud.sh --gc

      - uses: ./.github/actions/build-bundle
        with:
          arch: ${{ inputs.arch || 'x86_64' }}

      - name: Run smoke test on a throwaway server
        run: |
          e2e/hcloud.sh --arch "${{ inputs.arch || 'x86_64' }}" \
            --acme "${{ inputs.acme || 'letsencrypt-staging' }}"
