name: Release Tond

# `just release` pushes a v* tag, which builds, packages and publishes both
# architectures. Can also be run manually (builds and uploads the bundles as
# workflow artifacts; only tag runs create a GitHub Release).
on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (supply-chain hardening); the comment names
# the tag or branch the SHA was taken from.

jobs:
  build:
    name: Build tond-linux-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Native build on a runner of the target architecture; writes
      # dist/tond-linux-<arch>.tar.gz and its .sha256.
      - uses: ./.github/actions/build-bundle
        with:
          arch: ${{ matrix.arch }}
          profile: release
          version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tond-linux-${{ matrix.arch }}
          path: |
            dist/tond-linux-${{ matrix.arch }}.tar.gz
            dist/tond-linux-${{ matrix.arch }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to create releases
      pull-requests: read # Required by git-cliff when resolving GitHub PR metadata
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Full history needed for changelog

      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c tond-linux-x86_64.tar.gz.sha256 tond-linux-aarch64.tar.gz.sha256

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/tond-linux-x86_64.tar.gz
            dist/tond-linux-x86_64.tar.gz.sha256
            dist/tond-linux-aarch64.tar.gz
            dist/tond-linux-aarch64.tar.gz.sha256
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
