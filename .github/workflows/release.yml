name: Release Tond

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write # Required to create releases
  pull-requests: read # Required by git-cliff when resolving GitHub PR metadata

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history needed for changelog

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: |
          cargo build -p tond-server --release --locked
          cargo build -p tond-proxy --release --locked
          cargo build -p tond-cli --release --locked

      - name: Build dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Create release package
        run: |
          mkdir -p dist/tond-linux-x86_64/dashboard
          cp target/release/tond-server dist/tond-linux-x86_64/
          cp target/release/tond-proxy dist/tond-linux-x86_64/
          cp target/release/tond dist/tond-linux-x86_64/
          cp -r dashboard/build/* dist/tond-linux-x86_64/dashboard/
          cp release/install.sh dist/tond-linux-x86_64/
          cp release/update.sh dist/tond-linux-x86_64/
          cp release/tond-server.service dist/tond-linux-x86_64/
          cp release/tond-proxy.service dist/tond-linux-x86_64/
          chmod +x dist/tond-linux-x86_64/install.sh
          chmod +x dist/tond-linux-x86_64/update.sh
          # Write VERSION so install.sh can persist it to /opt/tond/VERSION on the host.
          echo "${GITHUB_REF_NAME#v}" > dist/tond-linux-x86_64/VERSION
          cd dist && tar -czf tond-linux-x86_64.tar.gz tond-linux-x86_64

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tond-linux-x86_64.tar.gz > tond-linux-x86_64.tar.gz.sha256

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            dist/tond-linux-x86_64.tar.gz
            dist/tond-linux-x86_64.tar.gz.sha256
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/tond-linux-x86_64.tar.gz
            dist/tond-linux-x86_64.tar.gz.sha256
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
