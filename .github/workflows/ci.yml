name: CI

# Manual only, to save Actions minutes: day-to-day checks run locally
# (just check, just test, just vm-e2e). Run from the Actions tab when needed.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --doc --locked
      # Includes the tond-scanner fixture tests, which build and run images with Docker.
      - run: cargo nextest run --workspace --locked

  dashboard:
    name: Dashboard (check, lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (install + smoke test, Pebble ACME)
    # Only spend the ~10 minutes once the fast checks pass.
    needs: [rust, dashboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-bundle

      # The runner is a disposable Ubuntu VM with systemd, Docker and root —
      # the same kind of machine Tond is installed on.
      - name: Install and run smoke test
        run: sudo e2e/run.sh --bundle dist/tond-linux-x86_64 --acme pebble --base-domain tond.test
