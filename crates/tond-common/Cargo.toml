[package]
name = "tond-common"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
serde_with = { workspace = true }
rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# JSON Schema derives for the OpenAPI spec. Only tond-server's tests (which
# generate docs/openapi.json) enable it, so release binaries don't carry it.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
tempfile = { workspace = true }
